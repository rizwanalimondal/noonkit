[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noonkit"
version = "0.1.0"
description = "Open, methodology-transparent analysis of ship noon reports: vessel performance and IMO CII compliance."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rizwan" }]
keywords = ["maritime", "shipping", "noon-report", "cii", "imo", "vessel-performance", "decarbonisation", "marpol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
cli = ["click>=8.0"]

[project.scripts]
noonkit = "noonkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
